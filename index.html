<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wordly - Dictionary & Vocabulary Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-50 text-slate-800 transition-colors duration-200 min-h-screen flex flex-col">
 <header class="border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="bg-indigo-600 text-white p-2 rounded-xl">
          <i data-lucide="book-open" class="w-5 h-5"></i>
        </div>
        <span class="font-bold text-xl tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Wordly</span>
      </div>
      
      <div class="flex items-center gap-2">
        <button id="themeToggle" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" aria-label="Toggle Theme">
          <i data-lucide="moon" class="w-5 h-5"></i>
        </button>
        <button id="savedWordsBtn" class="flex items-center gap-2 px-3 py-1.5 text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
          <i data-lucide="bookmark" class="w-4 h-4 text-indigo-600"></i>
          <span>Saved Words</span>
          <span id="savedCount" class="bg-indigo-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-1 w-full">
    
    <form id="searchForm" class="relative mb-6">
      <div class="relative flex items-center">
        <i data-lucide="search" class="absolute left-4 w-5 h-5 text-slate-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search for any word..." 
          class="w-full pl-12 pr-28 py-3.5 bg-white border border-slate-200 rounded-2xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-800 placeholder-slate-400 font-medium text-lg transition-all"
          autocomplete="off"
          aria-label="Search word input"
        />
        <button 
          type="submit" 
          class="absolute right-2 px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-sm transition-all text-sm flex items-center gap-1"
        >
          <span>Search</span>
        </button>
      </div>
    </form>

    <div id="recentContainer" class="flex items-center gap-2 flex-wrap mb-8 min-h-[32px]">
      <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mr-1">Recent:</span>
      <div id="recentTags" class="flex items-center gap-2 flex-wrap"></div>
    </div>

    <div id="loadingState" class="hidden py-16 text-center">
      <div class="inline-block animate-spin text-indigo-600 mb-4">
        <i data-lucide="loader-2" class="w-10 h-10"></i>
      </div>
      <p class="text-slate-500 font-medium">Fetching definitions from Dictionary API...</p>
    </div>

    <div id="errorState" class="hidden p-6 bg-rose-50 border border-rose-200 rounded-2xl text-center my-6">
      <i data-lucide="alert-circle" class="w-12 h-12 text-rose-500 mx-auto mb-3"></i>
      <h3 id="errorTitle" class="text-lg font-bold text-rose-900 mb-1">Word Not Found</h3>
      <p id="errorMessage" class="text-rose-700 text-sm max-w-md mx-auto">We couldn't find definitions for the word you were looking for.</p>
    </div>

    <div id="resultsContainer" class="hidden space-y-6">
      <div class="bg-white p-6 rounded-2xl border border-slate-200/80 shadow-sm flex items-start justify-between">
        <div>
          <div class="flex items-center gap-3">
            <h1 id="resultWord" class="text-4xl font-extrabold text-slate-900 tracking-tight">--</h1>
            <button id="saveWordBtn" class="p-2 hover:bg-slate-100 rounded-full text-slate-400 hover:text-indigo-600 transition-colors" title="Save Word">
              <i data-lucide="bookmark" class="w-6 h-6"></i>
            </button>
          </div>
          <p id="resultPhonetic" class="text-indigo-600 font-medium text-lg mt-1">/ -- /</p>
        </div>
        
        <button id="audioBtn" class="hidden flex items-center justify-center w-12 h-12 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-2xl transition-colors">
          <i data-lucide="volume-2" class="w-6 h-6"></i>
        </button>
      </div>

      <div id="meaningsList" class="space-y-6"></div>

      <div class="text-xs text-slate-400 border-t border-slate-200 pt-4 flex items-center gap-1">
        <span>Source:</span>
        <a id="sourceUrl" href="#" target="_blank" rel="noopener noreferrer" class="underline hover:text-indigo-600 flex items-center gap-1">
          <span>Free Dictionary API</span>
          <i data-lucide="external-link" class="w-3 h-3"></i>
        </a>
      </div>
    </div>

    <div id="savedModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex justify-end">
      <div class="bg-white w-full max-w-md h-full shadow-2xl p-6 overflow-y-auto flex flex-col">
        <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-4">
          <div class="flex items-center gap-2">
            <i data-lucide="bookmark" class="w-5 h-5 text-indigo-600"></i>
            <h2 class="font-bold text-xl">Saved Vocabulary</h2>
          </div>
          <button id="closeSavedBtn" class="p-1 hover:bg-slate-100 rounded-lg text-slate-500">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
        <div id="savedList" class="flex-1 space-y-3"></div>
      </div>
    </div>
  </main>

  <script type="module" src="./index.js"></script>
</body>
</html>
